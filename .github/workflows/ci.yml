name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Server + SDK tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: server/pyproject.toml
      - name: Install
        run: pip install -e "server[dev]" -e sdk/python
      - name: Server tests
        working-directory: server
        run: pytest -q
      - name: SDK tests (incl. end-to-end against the server)
        working-directory: sdk/python
        run: pytest -q

  dashboard:
    name: Dashboard lint + build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dashboard
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: dashboard/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build  # also type-checks (generates PageProps/LayoutProps first)

  docker:
    name: Docker images build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: docker compose build
        env:
          DKM_DASHBOARD_PASSWORD: ci-only
